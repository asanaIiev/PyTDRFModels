services:

  api:
    image: docker.io/asanaliev/pytfastapimodels:latest
    container_name: django_backend
    ports:
      - "8000:8000"
    restart: always

  frontend:
    image: docker.io/asanaliev/pytfastapimodels:latest
    container_name: streamlit_ui
    depends_on:
      - api
    ports:
      - "8501:8501"
    command: streamlit run settings/frontend/st.py --server.address 0.0.0.0
    restart: always